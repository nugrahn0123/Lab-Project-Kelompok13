# k8s/ticket-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
spec:
  replicas: 3
  selector:
    matchLabels: { app: ticket-service }
  template:
    metadata:
      labels: { app: ticket-service }
    spec:
      containers:
        - name: ticket-service
          image: ticket-service:lab
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-urls, key: ticket-url }
            - name: REDIS_URL
              value: redis://redis:6379
            - name: EVENT_SERVICE_URL
              value: http://event-service:3001
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:3004
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
spec:
  selector: { app: ticket-service }
  ports:
    - port: 3002
