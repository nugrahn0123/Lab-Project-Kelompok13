# k8s/event-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
spec:
  replicas: 3
  selector:
    matchLabels: { app: event-service }
  template:
    metadata:
      labels: { app: event-service }
    spec:
      containers:
        - name: event-service
          image: event-service:lab
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-urls, key: event-url }
            - name: REDIS_URL
              value: redis://redis:6379
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
spec:
  selector: { app: event-service }
  ports:
    - port: 3001
