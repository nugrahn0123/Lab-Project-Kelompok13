version: "3.8"

services:
  # Database: Neon PostgreSQL (cloud) — satu database, empat schema logis
  # Schema: event_db | ticket_db | payment_db | notification_db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ./services/web
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:80
      - TICKET_SERVICE_URL=http://ticket-service:3002
      - EVENT_SERVICE_URL=http://event-service:3001
      - NODE_ENV=production
    depends_on:
      - gateway

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      event-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    deploy:
      replicas: 3
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  ticket-service:
    build: ./services/ticket-service
    deploy:
      replicas: 3
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - EVENT_SERVICE_URL=http://event-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    deploy:
      replicas: 3
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - TICKET_SERVICE_URL=http://ticket-service:3002
      - EVENT_SERVICE_URL=http://event-service:3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  notification-service:
    build: ./services/notification-service
    deploy:
      replicas: 3
    environment:
      - PORT=3004
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
