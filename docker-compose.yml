version: "3.8"

services:
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - event-service
      - ticket-service
      - payment-service
      - notification-service

  event-service:
    build: ./services/event-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development

  ticket-service:
    build: ./services/ticket-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=development

  payment-service:
    build: ./services/payment-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=development
      - TICKET_SERVICE_URL=http://ticket-service:3002
      - EVENT_SERVICE_URL=http://event-service:3001

  notification-service:
    build: ./services/notification-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
